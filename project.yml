name: DoiTa
options:
  bundleIdPrefix: com.danle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Để trống: Xcode sẽ tự ký "Sign to Run Locally" cho Simulator.
    # Khi chạy trên máy thật, chọn Team (kể cả Personal Team free) trong Signing & Capabilities.
    DEVELOPMENT_TEAM: ""

targets:
  DoiTa:
    type: application
    platform: iOS
    sources:
      - path: DoiTa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danle.doita
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
