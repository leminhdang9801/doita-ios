name: DoiTa
options:
  bundleIdPrefix: com.danle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Điền Team ID của bạn ở đây, hoặc chọn trong Xcode › Signing & Capabilities
    DEVELOPMENT_TEAM: ""

targets:
  DoiTa:
    type: application
    platform: iOS
    sources:
      - path: DoiTa
      - path: Shared
    dependencies:
      - target: DoiTaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danle.doita
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DoiTa.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  DoiTaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DoiTaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danle.doita.widget
        INFOPLIST_FILE: DoiTaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DoiTaWidget/DoiTaWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
